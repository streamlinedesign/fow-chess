<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eat the King</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="loading">
  <div class="logo" aria-label="Eat the King">
    <svg viewBox="4 2 92 92" aria-hidden="true">
      <g class="ink" stroke-width="7" stroke-linejoin="round">
        <rect x="22" y="78" width="56" height="10" rx="2.5"/><path d="M32 78 C37 66 41 58 42 50 H58 C59 58 63 66 68 78 Z"/><rect x="35" y="44" width="30" height="7" rx="2"/><path d="M33 45 L29 29 C36 24 64 24 71 29 L67 45 Z"/><path d="M46.75 27 V20 H40.5 V14 H46.75 V8 H53.25 V14 H59.5 V20 H53.25 V27 Z"/>
      </g>
      <g class="paper">
        <rect x="22" y="78" width="56" height="10" rx="2.5"/><path d="M32 78 C37 66 41 58 42 50 H58 C59 58 63 66 68 78 Z"/><rect x="35" y="44" width="30" height="7" rx="2"/><path d="M33 45 L29 29 C36 24 64 24 71 29 L67 45 Z"/><path d="M46.75 27 V20 H40.5 V14 H46.75 V8 H53.25 V14 H59.5 V20 H53.25 V27 Z"/>
      </g>
      <g class="lines" fill="none" stroke-width="2.75" stroke-linecap="round">
        <path d="M22 78 H78"/><path d="M35 51 H65"/><path d="M33 45 H67"/><path d="M34 32.5 C41 29.5 59 29.5 66 32.5"/>
      </g>
    </svg>
    <span>Eat the King</span>
  </div>
  <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
  <p id="step" class="mono">Connecting</p>
</main>

<main id="offline" hidden>
  <svg class="king" viewBox="4 2 92 92" aria-hidden="true"><use href="#k"/></svg>
  <h1>Can’t reach the game.</h1>
  <p id="retry">Check your connection.</p>
  <button id="now" type="button">Try now</button>
</main>

<footer class="mono" id="version"></footer>
<script src="main.js"></script>
</body>
</html>
