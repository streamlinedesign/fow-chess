name: ci

# Runs once per push to any branch but main; the check is attached to the
# commit, so the pull request shows it.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod', 'server/go.mod') != ''
        with:
          go-version-file: ${{ hashFiles('go.mod') != '' && 'go.mod' || 'server/go.mod' }}
          cache: true
      - uses: actions/setup-node@v4
        if: hashFiles('package.json', 'web/package.json') != ''
        with:
          node-version: 22
      - run: make test
      - run: make build
