# Local Postgres for development. `make dev` starts it; `make db-stop` stops it.
# Data lives in the chess-db volume and survives restarts (`make db-reset` wipes it).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chess-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  chess-db:
